<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sirina</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong theme.
      // `window.__THEME__` is injected by the backend (the durable source of truth in
      // the packaged app, where a per-launch port wipes localStorage); fall back to the
      // localStorage cache otherwise.
      (function () {
        try {
          var c = window.__THEME__ || localStorage.getItem("sirina-theme");
          if (window.__THEME__) {
            try { localStorage.setItem("sirina-theme", window.__THEME__); } catch (e) {}
          }
          var dark =
            c === "dark" ||
            ((c === "auto" || !c) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
