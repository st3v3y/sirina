[project]
name = "sirina"
version = "0.1.0"
description = "Local meeting transcriber (WhisperKit / faster-whisper) with local AI summaries"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26,<2.3",
    "ollama>=0.4",
    "httpx>=0.27",
    "sounddevice>=0.5",
    "keyring>=25.7.0",
    "psutil>=5.9",
    "av>=17,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
