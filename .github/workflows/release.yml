# Builds the app for macOS, Windows and Linux and attaches the installers to a GitHub release.
#
#   - Push a tag like v0.1.0 → builds and publishes the release (a tag with a "-", such as
#     v0.2.0-rc.1, becomes a pre-release).
#   - Pull requests that touch packaging, and manual runs → build only; the installers are
#     kept as workflow artifacts for 7 days.
#
# The macOS app is ad-hoc signed (no Apple Developer ID), like a local
# ./scripts/build-macos-app.sh. The Windows and Linux builds are unsigned, untested previews:
# a failure there never blocks the macOS release.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-*
      - backend/packaging/**
      - frontend/src-tauri/**
      - native/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    # The speech helper uses SpeechTranscriber, which needs the macOS 26 SDK (Xcode 26+).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' frontend/src-tauri/tauri.conf.json | head -1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION%%-*}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $APP_VERSION in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)

      # Optional: sign with a stable self-signed "Code Signing" certificate, so macOS keeps
      # the Screen Recording grant across launches and updates (see docs/PACKAGING.md).
      # Without the secrets the app is ad-hoc signed.
      - name: Import the signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No MACOS_SIGNING_CERT_P12 secret; the app will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '"[^"]+"' | head -1 | tr -d '"')"
          echo "Signing with: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          # The smoke test needs a voice for `say` and downloaded models; the runner has neither.
          SKIP_SMOKE: "1"
          CODESIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: ./scripts/build-macos-app.sh

      - name: Upload the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sirina-macOS-arm64
          path: frontend/src-tauri/target/release/bundle/dmg/Sirina-macOS-arm64.dmg
          retention-days: 7

  windows:
    name: Windows (x64, preview)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri
            native/system-audio-capture-rs

      - name: Install dependencies
        run: |
          cd backend; uv sync --frozen; cd ..
          cd frontend; npm ci

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      # A stable name, so links can point at releases/latest/download/<name>.
      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Sirina-Windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Sirina-Windows-x64
          path: Sirina-Windows-x64-setup.exe
          retention-days: 7

  linux:
    name: Linux (x64 .deb, preview)
    # The oldest supported runner keeps the package's glibc floor low.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            libpulse-dev libportaudio2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri
            native/system-audio-capture-rs

      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)

      - name: Build the package
        run: ./scripts/build-linux.sh

      - name: Name the package
        run: cp frontend/src-tauri/target/release/bundle/deb/*.deb Sirina-Linux-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Sirina-Linux-x64
          path: Sirina-Linux-x64.deb
          retention-days: 7

  publish:
    name: Publish the release
    needs: [macos, windows, linux]
    # Publish whenever macOS built; a failed preview build is just left out.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the installers
        run: ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### macOS (Apple Silicon, macOS 14 or later)

            Download `Sirina-macOS-arm64.dmg`. Open it and drag Sirina to Applications. The app
            is not notarized by Apple, so the first launch is blocked: open **System Settings →
            Privacy & Security**, scroll down and click **Open Anyway**.

            ### Windows and Linux: untested preview

            These builds come straight from CI and **haven't been tried on a real machine yet**.
            They record your mic and call audio and transcribe after the recording (on the CPU,
            so slower than on a Mac). Live captions and speaker splitting are macOS-only for now.
            Please [report what works and what doesn't](https://github.com/st3v3y/sirina/issues).

            - **Windows 10/11 (x64):** `Sirina-Windows-x64-setup.exe`. It is unsigned: in the
              SmartScreen prompt choose **More info → Run anyway**.
            - **Linux (x64, Debian/Ubuntu):** `Sirina-Linux-x64.deb`. Install with
              `sudo apt install ./Sirina-Linux-x64.deb` (needs PulseAudio or PipeWire).

            See the [installation guide](https://github.com/st3v3y/sirina#installation) for details.
          prerelease: ${{ contains(github.ref_name, '-') }}
