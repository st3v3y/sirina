# Test and bundle Sirina on every platform. Bundles are uploaded as run artifacts;
# nothing is signed or released here.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            # Needs an Xcode with the macOS 26 SDK: speech-engine uses SpeechTranscriber.
            os: macos-26
            bundle: |
              frontend/src-tauri/target/release/bundle/macos/*.app
          - name: Windows (x64)
            os: windows-latest
            bundle: |
              frontend/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (x64)
            # The oldest supported runner keeps the package's glibc floor low.
            os: ubuntu-22.04
            bundle: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    env:
      SKIP_SMOKE: "1"  # the speech-engine smoke test needs downloaded models
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            libpulse-dev libportaudio2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri
            native/system-audio-capture-rs

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        # main has 15 pre-existing react-hooks/set-state-in-effect errors; make this
        # blocking once they are fixed.
        continue-on-error: true
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos-app.sh

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sirina-${{ runner.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
